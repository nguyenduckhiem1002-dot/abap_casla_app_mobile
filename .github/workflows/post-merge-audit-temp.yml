name: Temporary post-merge ABAP validation

on:
  push:
    branches:
      - chatgpt/post-merge-abap-audit
    paths:
      - .github/workflows/post-merge-audit-temp.yml

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt/post-merge-abap-audit
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Align immutable mapping comment
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('serialized/zbp_i_mob_user.clas.locals_imp.abap')
          text = p.read_text(encoding='utf-8')
          old = (
              '    "MobileUserRole is a composition child declared "authorization dependent\n'
              '    "by _User", so RAP delegates every operation on it - create by\n'
              '    "association, update, delete - to this master\'s %update. Leaving %update\n'
          )
          new = (
              '    "MobileUserRole is a composition child declared "authorization dependent\n'
              '    "by _User", so RAP delegates create-by-association and delete to this\n'
              '    "master\'s %update authorization. Leaving %update\n'
          )
          if text.count(old) != 1:
              raise SystemExit('authorization comment anchor not found exactly once')
          p.write_text(text.replace(old, new), encoding='utf-8')
          PY

      - name: ABAP Cloud static validation
        run: npx --yes @abaplint/cli@2.120.35

      - name: Verify RAP remediation contracts
        shell: bash
        run: |
          grep -q 'validation validateRole on save' serialized/zi_mob_role.bdef.asbdef
          grep -q 'validation validateFunctionAssignment on save' serialized/zi_mob_role.bdef.asbdef
          grep -q 'validation validateWorkAssignment on save' serialized/zi_mob_role.bdef.asbdef
          grep -q 'validation validateFunction on save' serialized/zi_mob_func.bdef.asbdef
          grep -q 'validation validateRoleAssignment on save' serialized/zi_mob_user.bdef.asbdef
          grep -q 'METHOD validateRole\.' serialized/zbp_i_mob_role.clas.locals_imp.abap
          grep -q 'METHOD validateFunctionAssignment\.' serialized/zbp_i_mob_role.clas.locals_imp.abap
          grep -q 'METHOD validateFunction\.' serialized/zbp_i_mob_func.clas.locals_imp.abap
          ! grep -q '<FIELDNAME>MODULE</FIELDNAME>' serialized/ztb_mob_func.tabl.xml
          ! grep -q 'provider contract transactional_query' serialized/zc_mob_rolfunc_adm.ddls.asddls
          ! grep -q 'provider contract transactional_query' serialized/zc_mob_rolwork_adm.ddls.asddls
          ! grep -q 'provider contract transactional_query' serialized/zc_mob_usrrol_adm.ddls.asddls
          python3 - <<'PY'
          from pathlib import Path
          import re
          checks = [
              ('serialized/zi_mob_role.bdef.asbdef', 'ZI_MOB_RolFunc'),
              ('serialized/zc_mob_role_adm.bdef.asbdef', 'ZC_MOB_RolFunc_Adm'),
              ('serialized/zi_mob_user.bdef.asbdef', 'ZI_MOB_UsrRol'),
              ('serialized/zc_mob_user_adm.bdef.asbdef', 'ZC_MOB_UsrRol_Adm'),
          ]
          for filename, entity in checks:
              text = Path(filename).read_text(encoding='utf-8')
              match = re.search(
                  r'define\s+behavior\s+for\s+' + re.escape(entity) + r'.*?\{(.*?)\n\}',
                  text,
                  re.I | re.S,
              )
              if not match:
                  raise SystemExit(f'{filename}: behavior block {entity} missing')
              block = match.group(1)
              if re.search(r'(^|\n)\s*(use\s+)?update\s*;', block, re.I):
                  raise SystemExit(f'{filename}: immutable mapping {entity} still exposes update')
              if not re.search(r'(^|\n)\s*(use\s+)?delete\s*;', block, re.I):
                  raise SystemExit(f'{filename}: immutable mapping {entity} missing delete')
          PY

      - name: Commit comment cleanup
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add serialized/zbp_i_mob_user.clas.locals_imp.abap
          git diff --cached --quiet && exit 0
          git commit -m "Align user-role authorization comment with immutable mapping"
          git push origin HEAD:chatgpt/post-merge-abap-audit
