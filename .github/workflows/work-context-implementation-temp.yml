name: Temporary work-context implementation validation

on:
  push:
    branches:
      - chatgpt/role-work-context-fiori-admin
    paths:
      - .github/workflows/work-context-implementation-temp.yml

permissions:
  contents: write

jobs:
  patch-and-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt/role-work-context-fiori-admin
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Apply scoped runtime patches
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new, label):
              p = Path(path)
              text = p.read_text()
              if old not in text:
                  raise SystemExit(f"Missing patch anchor: {label} in {path}")
              p.write_text(text.replace(old, new, 1))

          user = 'serialized/zbp_i_mob_user.clas.locals_imp.abap'

          replace_once(
              user,
              """    IF normalized IS INITIAL OR input-Password IS INITIAL.\n      report_error( EXPORTING cid = cid\n                              text = 'Tên đăng nhập và mật khẩu là bắt buộc'\n                    CHANGING failed = failed reported = reported ).\n      RETURN.\n    ENDIF.\n""",
              """    IF normalized IS INITIAL OR input-Password IS INITIAL\n       OR input-RoleID IS INITIAL.\n      report_error( EXPORTING cid = cid\n                              text = 'Tên đăng nhập, mật khẩu và chức danh ban đầu là bắt buộc'\n                    CHANGING failed = failed reported = reported ).\n      RETURN.\n    ENDIF.\n""",
              'create-user mandatory role')

          replace_once(
              user,
              """    IF existing_users IS NOT INITIAL.\n      report_error( EXPORTING cid = cid text = 'Tên đăng nhập đã tồn tại'\n                    CHANGING failed = failed reported = reported ).\n      RETURN.\n    ENDIF.\n    DATA(worker_id) = to_upper( condense( CONV string( input-WorkerID ) ) ).\n""",
              """    IF existing_users IS NOT INITIAL.\n      report_error( EXPORTING cid = cid text = 'Tên đăng nhập đã tồn tại'\n                    CHANGING failed = failed reported = reported ).\n      RETURN.\n    ENDIF.\n    DATA(role_id) = CONV ztb_mob_role-role_id( input-RoleID ).\n    SELECT FROM ztb_mob_role\n      FIELDS role_id\n      WHERE role_id = @role_id\n        AND status = 'A'\n      INTO TABLE @DATA(active_roles)\n      UP TO 1 ROWS.\n    IF active_roles IS INITIAL.\n      report_error( EXPORTING cid = cid\n                              text = 'Chức danh không tồn tại hoặc không còn hiệu lực'\n                    CHANGING failed = failed reported = reported ).\n      RETURN.\n    ENDIF.\n    DATA(worker_id) = to_upper( condense( CONV string( input-WorkerID ) ) ).\n""",
              'create-user active role validation')

          replace_once(
              user,
              """          HashIterations = c_iterations PasswordChangedAt = now\n          CredentialStatus = 'A' ) ) ) )\n      MAPPED DATA(mapped_create) FAILED DATA(failed_create)\n""",
              """          HashIterations = c_iterations PasswordChangedAt = now\n          CredentialStatus = 'A' ) ) ) )\n      ENTITY MobileUser CREATE BY \\_Roles FIELDS ( RoleID )\n      WITH VALUE #( ( %cid_ref = 'USR'\n        %target = VALUE #( ( %cid = 'ROL' RoleID = role_id ) ) ) )\n      MAPPED DATA(mapped_create) FAILED DATA(failed_create)\n""",
              'deep-create initial role')

          replace_once(
              user,
              """    DATA(permissions) = zcl_mob_token_validator=>get_permissions(\n      user-user_uuid ).\n    result = VALUE #( ( %cid = cid %param = VALUE #(\n""",
              """    DATA(permissions) = zcl_mob_token_validator=>get_permissions(\n      user-user_uuid ).\n    DATA(work_contexts) = zcl_mob_token_validator=>get_work_contexts(\n      user-user_uuid ).\n    result = VALUE #( ( %cid = cid %param = VALUE #(\n""",
              'login load work contexts')

          replace_once(
              user,
              """      _Permissions = VALUE #( FOR permission IN permissions\n        ( FuncID = permission-func_id\n          FuncName = permission-func_name\n          Module = permission-module ) ) ) ) ).\n  ENDMETHOD.\n\n  METHOD logout.\n""",
              """      _Permissions = VALUE #( FOR permission IN permissions\n        ( FuncID = permission-func_id\n          FuncName = permission-func_name\n          Module = permission-module ) )\n      _WorkContexts = VALUE #( FOR work_context IN work_contexts\n        ( WorkID = work_context-work_id\n          WorkName = work_context-work_name\n          Plant = work_context-plant\n          WorkCenter = work_context-workcenter\n          BoPhan = work_context-bo_phan\n          Location = work_context-location ) ) ) ) ).\n  ENDMETHOD.\n\n  METHOD logout.\n""",
              'login return work contexts')

          replace_once(
              user,
              """    DATA(permissions) = zcl_mob_token_validator=>get_permissions(\n      session-user_uuid ).\n    result = VALUE #( ( %cid = cid %param = VALUE #(\n""",
              """    DATA(permissions) = zcl_mob_token_validator=>get_permissions(\n      session-user_uuid ).\n    DATA(work_contexts) = zcl_mob_token_validator=>get_work_contexts(\n      session-user_uuid ).\n    result = VALUE #( ( %cid = cid %param = VALUE #(\n""",
              'refresh load work contexts')

          replace_once(
              user,
              """      _Permissions = VALUE #( FOR permission IN permissions\n        ( FuncID = permission-func_id\n          FuncName = permission-func_name\n          Module = permission-module ) ) ) ) ).\n  ENDMETHOD.\n\n  METHOD changepassword.\n""",
              """      _Permissions = VALUE #( FOR permission IN permissions\n        ( FuncID = permission-func_id\n          FuncName = permission-func_name\n          Module = permission-module ) )\n      _WorkContexts = VALUE #( FOR work_context IN work_contexts\n        ( WorkID = work_context-work_id\n          WorkName = work_context-work_name\n          Plant = work_context-plant\n          WorkCenter = work_context-workcenter\n          BoPhan = work_context-bo_phan\n          Location = work_context-location ) ) ) ) ).\n  ENDMETHOD.\n\n  METHOD changepassword.\n""",
              'refresh return work contexts')

          p = Path(user)
          text = p.read_text()
          if 'CLASS lhc_mobileuserrole DEFINITION' in text:
              raise SystemExit('User-role validation handler unexpectedly already exists')
          text += """\n\nCLASS lhc_mobileuserrole DEFINITION INHERITING FROM cl_abap_behavior_handler.\n  PRIVATE SECTION.\n    METHODS validateRoleAssignment FOR VALIDATE ON SAVE\n      IMPORTING keys FOR MobileUserRole~validateRoleAssignment.\nENDCLASS.\n\nCLASS lhc_mobileuserrole IMPLEMENTATION.\n  METHOD validateRoleAssignment.\n    READ ENTITIES OF zi_mob_user IN LOCAL MODE\n      ENTITY MobileUserRole\n      FIELDS ( RoleID )\n      WITH CORRESPONDING #( keys )\n      RESULT DATA(assignments).\n\n    LOOP AT assignments ASSIGNING FIELD-SYMBOL(<assignment>).\n      SELECT FROM ztb_mob_role\n        FIELDS role_id\n        WHERE role_id = @<assignment>-RoleID\n          AND status = 'A'\n        INTO TABLE @DATA(active_roles)\n        UP TO 1 ROWS.\n      IF active_roles IS INITIAL.\n        APPEND VALUE #( %tky = <assignment>-%tky ) TO failed-mobileuserrole.\n        APPEND VALUE #(\n          %tky = <assignment>-%tky\n          %element-RoleID = if_abap_behv=>mk-on\n          %msg = new_message_with_text(\n            severity = if_abap_behv_message=>severity-error\n            text = 'Chức danh không tồn tại hoặc không còn hiệu lực' ) )\n          TO reported-mobileuserrole.\n      ENDIF.\n    ENDLOOP.\n  ENDMETHOD.\nENDCLASS.\n"""
          p.write_text(text)

          token = 'serialized/zcl_mob_token_validator.clas.abap'
          replace_once(
              token,
              """           permissions TYPE SORTED TABLE OF permission WITH UNIQUE KEY func_id.\n""",
              """           permissions TYPE SORTED TABLE OF permission WITH UNIQUE KEY func_id.\n    TYPES: BEGIN OF work_context,\n             work_id    TYPE ztb_mob_work-work_id,\n             work_name  TYPE ztb_mob_work-work_name,\n             plant      TYPE ztb_mob_work-plant,\n             workcenter TYPE ztb_mob_work-workcenter,\n             bo_phan    TYPE ztb_mob_work-bo_phan,\n             location   TYPE ztb_mob_work-location,\n           END OF work_context,\n           work_contexts TYPE SORTED TABLE OF work_context WITH UNIQUE KEY work_id.\n""",
              'token validator work-context types')

          replace_once(
              token,
              """    CLASS-METHODS get_permissions\n      IMPORTING user_uuid TYPE sysuuid_x16\n      RETURNING VALUE(result) TYPE permissions.\n    CLASS-METHODS has_function\n""",
              """    CLASS-METHODS get_permissions\n      IMPORTING user_uuid TYPE sysuuid_x16\n      RETURNING VALUE(result) TYPE permissions.\n    CLASS-METHODS get_work_contexts\n      IMPORTING user_uuid TYPE sysuuid_x16\n      RETURNING VALUE(result) TYPE work_contexts.\n    CLASS-METHODS has_work_scope\n      IMPORTING user_uuid TYPE sysuuid_x16\n                plant TYPE ztb_mob_work-plant\n                work_center TYPE ztb_mob_work-workcenter\n      RETURNING VALUE(result) TYPE abap_bool.\n    CLASS-METHODS has_function\n""",
              'token validator work-context methods')

          replace_once(
              token,
              """      INTO CORRESPONDING FIELDS OF TABLE @result.\n  ENDMETHOD.\n\n  METHOD has_function.\n""",
              """      INTO CORRESPONDING FIELDS OF TABLE @result.\n  ENDMETHOD.\n\n  METHOD get_work_contexts.\n    SELECT FROM ztb_mob_usr_rol AS assignment\n      INNER JOIN ztb_mob_role AS role_hdr\n        ON role_hdr~role_id = assignment~role_id\n      INNER JOIN ztb_mob_rol_wrk AS role_work\n        ON role_work~role_id = assignment~role_id\n      INNER JOIN ztb_mob_work AS work\n        ON work~work_id = role_work~work_id\n      FIELDS DISTINCT work~work_id, work~work_name, work~plant,\n                      work~workcenter, work~bo_phan, work~location\n      WHERE assignment~user_uuid = @user_uuid\n        AND role_hdr~status = 'A'\n        AND work~is_active = 'A'\n      ORDER BY work~work_id\n      INTO CORRESPONDING FIELDS OF TABLE @result.\n  ENDMETHOD.\n\n  METHOD has_work_scope.\n    SELECT FROM ztb_mob_usr_rol AS assignment\n      INNER JOIN ztb_mob_role AS role_hdr\n        ON role_hdr~role_id = assignment~role_id\n      INNER JOIN ztb_mob_rol_wrk AS role_work\n        ON role_work~role_id = assignment~role_id\n      INNER JOIN ztb_mob_work AS work\n        ON work~work_id = role_work~work_id\n      FIELDS work~work_id\n      WHERE assignment~user_uuid = @user_uuid\n        AND role_hdr~status = 'A'\n        AND work~is_active = 'A'\n        AND work~plant = @plant\n        AND work~workcenter = @work_center\n      INTO TABLE @DATA(scopes)\n      UP TO 1 ROWS.\n    result = xsdbool( scopes IS NOT INITIAL ).\n  ENDMETHOD.\n\n  METHOD has_function.\n""",
              'token validator work-context implementations')

          pp = Path('serialized/zbp_r_pp_opalloc.clas.locals_imp.abap')
          text = pp.read_text()
          needle = "      DATA(operation) = operations[ 1 ].\n"
          if text.count(needle) < 3:
              raise SystemExit(f'Expected >=3 operation anchors, found {text.count(needle)}')
          scoped = needle + """      IF zcl_mob_token_validator=>has_work_scope(\n           user_uuid = auth-user_uuid\n           plant = operation-Plant\n           work_center = operation-WorkCenter ) = abap_false.\n        report_failure( EXPORTING cid = cid text = 'WORK_CONTEXT_NOT_ALLOWED'\n                        CHANGING failed = failed reported = reported ).\n        CONTINUE.\n      ENDIF.\n"""
          text = text.replace(needle, scoped, 3)
          pp.write_text(text)
          PY

      - name: Validate ABAP Cloud source
        run: npx --yes @abaplint/cli@2.120.35

      - name: Commit validated implementation
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add serialized/
          git diff --cached --quiet && exit 0
          git commit -m "Connect role work contexts to auth and PP scope"
          git push origin HEAD:chatgpt/role-work-context-fiori-admin
