name: Temporary metadata extension validation

on:
  push:
    branches:
      - chatgpt/role-work-context-fiori-admin
    paths:
      - .github/workflows/metadata-extension-temp.yml

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt/role-work-context-fiori-admin
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate ABAP Cloud source
        run: npx --yes @abaplint/cli@2.120.35
