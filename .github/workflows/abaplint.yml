name: ABAP lint

on:
  push:
    branches:
      - main
      - 'chatgpt/**'
  pull_request:

permissions:
  contents: read

jobs:
  abaplint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Kiểm tra cú pháp comment của artifact RAP/CDS
        shell: bash
        run: |
          set -euo pipefail
          if grep -RInE '^[[:space:]]*"' serialized \
            --include='*.asbdef' \
            --include='*.asddls' \
            --include='*.asdcls' \
            --include='*.asddlxs' \
            --include='*.srvdsrv'; then
            echo 'Phát hiện comment kiểu ABAP (") trong artifact CDS/BDEF/DCL/SRVD.'
            echo 'Các artifact này phải dùng // cho comment một dòng.'
            exit 1
          fi

      - name: Kiểm tra các pattern RAP dễ gây lỗi activation
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          user_bdef = Path('serialized/zi_mob_user.bdef.asbdef').read_text(encoding='utf-8')
          if user_bdef.count('deep result [1] ZA_MOB_LoginResult') != 2:
              raise SystemExit('login/refresh phải dùng deep result ZA_MOB_LoginResult')

          pp_bdef = Path('serialized/zr_pp_opalloc.bdef.asbdef').read_text(encoding='utf-8')
          if pp_bdef.count('deep result [1] ZA_PP_HistResult') != 1:
              raise SystemExit('getWorkHistory phải dùng deep result ZA_PP_HistResult')

          pp_impl = Path('serialized/zbp_r_pp_opalloc.clas.locals_imp.abap').read_text(encoding='utf-8')
          for method in ('initialAssign', 'transfer', 'recall', 'confirm', 'reverse', 'correctConfirm'):
              start = pp_impl.index(f'  METHOD {method}.')
              end = pp_impl.index('  ENDMETHOD.', start)
              block = pp_impl[start:end]
              if '<key>-%cid' in block:
                  raise SystemExit(f'{method}: input của bound action không có component %cid; phải dùng %tky')

          if 'corrections-correction_qty' in pp_impl:
              raise SystemExit('Aggregate một cột INTO @DATA(...) là scalar, không được dereference component')

          mde = Path('serialized/zc_md_congdoan_adm.ddlx.asddlxs').read_text(encoding='utf-8')
          annotate = mde.index('annotate entity ZC_MD_CongDoan_Adm with')
          opening_brace = mde.index('{', annotate)
          facet = mde.index('@UI.facet', annotate)
          if facet < opening_brace:
              raise SystemExit('@UI.facet của ZC_MD_CongDoan_Adm phải nằm trong block annotate')
          PY

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Run abaplint
        run: npx --yes @abaplint/cli@2.120.35
