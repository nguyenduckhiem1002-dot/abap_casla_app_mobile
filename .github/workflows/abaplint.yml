name: ABAP lint

on:
  push:
    branches:
      - main
      - 'chatgpt/**'
  pull_request:

permissions:
  contents: write

jobs:
  abaplint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Synchronize technical DOCX
        if: github.ref == 'refs/heads/chatgpt/ci-quality-remediation-20260828'
        shell: bash
        run: |
          python3 -m pip install --disable-pip-version-check --quiet python-docx==1.2.0
          python3 - <<'PY'
          from docx import Document
          from pathlib import Path

          path = Path('docs/CASLA_Mobile_Technical_Documentation.docx')
          doc = Document(path)
          replacements = {
            'Sai lệch cần xử lý: predicate hiện chỉ enforce tối thiểu 6 ký tự và không chứa username, trong khi error text createUser mô tả policy 12 ký tự gồm hoa/thường/số. Message không phải enforcement; nếu thay policy phải sửa predicate, message, migration và test đồng bộ.':
              'Policy hiện hành: mật khẩu phải dài tối thiểu 6 ký tự và không chứa username. Predicate và message của createUser/changePasswordAdmin đã được đồng bộ theo policy này. Nếu nâng policy, phải thay predicate, message, migration và ABAP Unit/test integration cùng một lần.',
            'Workflow .github/workflows/abaplint.yml chạy ABAP Cloud syntax/check/DDIC/complexity và các pattern RAP. Repository ghi nhận lần chạy gần nhất: @abaplint/cli 2.120.35, 0 issue(s), 241 file(s) analyzed.':
              'Workflow .github/workflows/abaplint.yml chạy custom RAP checks và @abaplint/cli 2.120.35 cho ABAP Cloud. Chạy local bằng bash scripts/check_ci.sh; CI phải xanh. Không ghi cố định số issue/file vì snapshot thay đổi theo source.'
          }
          changed = 0
          for paragraph in doc.paragraphs:
            if paragraph.text not in replacements:
              continue
            new_text = replacements[paragraph.text]
            if paragraph.runs:
              paragraph.runs[0].text = new_text
              for run in paragraph.runs[1:]:
                run.text = ''
            else:
              paragraph.add_run(new_text)
            changed += 1
          if changed not in (0, 2):
            raise SystemExit(f'Unexpected DOCX replacement count: {changed}')
          if changed == 2:
            doc.save(path)
          print(f'DOCX replacements: {changed}')
          PY

          if ! git diff --quiet -- docs/CASLA_Mobile_Technical_Documentation.docx; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add docs/CASLA_Mobile_Technical_Documentation.docx
            git commit -m "Synchronize technical documentation with remediation"
            git push origin HEAD:chatgpt/ci-quality-remediation-20260828
          fi

      - name: Upload synchronized technical DOCX
        if: github.ref == 'refs/heads/chatgpt/ci-quality-remediation-20260828'
        uses: actions/upload-artifact@v4
        with:
          name: casla-technical-docx-synchronized
          path: docs/CASLA_Mobile_Technical_Documentation.docx
          if-no-files-found: error
          retention-days: 1

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Run repository CI checks
        shell: bash
        run: bash scripts/check_ci.sh
