name: ABAP lint

on:
  push:
    branches:
      - main
      - 'chatgpt/**'
  pull_request:

permissions:
  contents: read

jobs:
  abaplint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Upload technical DOCX for verification
        if: github.ref == 'refs/heads/chatgpt/ci-quality-remediation-20260828'
        uses: actions/upload-artifact@v4
        with:
          name: casla-technical-docx-source
          path: docs/CASLA_Mobile_Technical_Documentation.docx
          if-no-files-found: error
          retention-days: 1

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Run repository CI checks
        shell: bash
        run: bash scripts/check_ci.sh
