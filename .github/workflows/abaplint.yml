name: ABAP lint

on:
  push:
    branches:
      - main
      - 'chatgpt/**'
  pull_request:

permissions:
  contents: read

jobs:
  abaplint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Kiểm tra cú pháp comment của artifact RAP/CDS
        shell: bash
        run: |
          set -euo pipefail
          if grep -RInE '^[[:space:]]*"' serialized \
            --include='*.asbdef' \
            --include='*.asddls' \
            --include='*.asdcls' \
            --include='*.asddlxs' \
            --include='*.srvdsrv'; then
            echo 'Phát hiện comment kiểu ABAP (") trong artifact CDS/BDEF/DCL/SRVD.'
            echo 'Các artifact này phải dùng // cho comment một dòng.'
            exit 1
          fi

      - name: Liệt kê comment để rà ngôn ngữ
        shell: bash
        run: |
          grep -RInE '^[[:space:]]*("|//)' serialized \
            --include='*.abap' \
            --include='*.asbdef' \
            --include='*.asddls' \
            --include='*.asdcls' \
            --include='*.asddlxs' \
            --include='*.srvdsrv' || true

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Run abaplint
        run: npx --yes @abaplint/cli@2.120.35
