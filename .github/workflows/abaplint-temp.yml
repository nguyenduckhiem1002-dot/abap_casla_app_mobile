name: Temporary ABAP syntax check

on:
  pull_request:
    branches:
      - main

jobs:
  abaplint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run abaplint Cloud checks
        run: npx --yes @abaplint/cli@2.120.35
