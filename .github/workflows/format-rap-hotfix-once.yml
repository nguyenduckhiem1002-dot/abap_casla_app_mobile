name: Format RAP hotfix once

on:
  push:
    branches:
      - chatgpt/fix-comment-syntax-vi

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Format report_instance_failure calls
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import re

          path = Path('serialized/zbp_r_pp_opalloc.clas.locals_imp.abap')
          text = path.read_text(encoding='utf-8')

          pattern = re.compile(
              r'(?m)^(?P<indent>[ \t]*)report_instance_failure\( EXPORTING '
              r'operation_uuid = <key>-%tky-OperationUUID text = (?P<expr>[^\n]+)\n'
              r'[ \t]*CHANGING failed = failed reported = reported \)\.$'
          )

          def repl(match):
              indent = match.group('indent')
              expr = match.group('expr')
              return (
                  f'{indent}report_instance_failure(\n'
                  f'{indent}  EXPORTING operation_uuid = <key>-%tky-OperationUUID\n'
                  f'{indent}            text = {expr}\n'
                  f'{indent}  CHANGING failed = failed reported = reported ).'
              )

          text, count = pattern.subn(repl, text)
          if count == 0:
              raise SystemExit('Không tìm thấy report_instance_failure để format')

          path.write_text(text, encoding='utf-8')
          print(f'Đã format {count} lời gọi report_instance_failure')
          PY

          git diff --check

      - name: Commit format
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo 'Không có thay đổi.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add serialized/zbp_r_pp_opalloc.clas.locals_imp.abap
          git commit -m 'Format RAP instance failure calls'
          git push
